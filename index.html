<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Sales Dashboard</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
      --good: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem;
    }

    header h1 { font-size: 1.5rem; }
    header p { color: var(--muted); font-size: 0.9rem; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .filters label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: var(--muted);
      gap: 0.3rem;
    }

    select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--card);
      min-width: 180px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
    }

    .kpi .label { color: var(--muted); font-size: 0.85rem; }
    .kpi .value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; }

    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }

    .panel h2 { font-size: 1.05rem; margin-bottom: 1rem; }

    .bar-row {
      display: grid;
      grid-template-columns: 120px 1fr 90px;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .bar-track {
      background: #eef2ff;
      border-radius: 4px;
      height: 16px;
      overflow: hidden;
    }

    .bar-fill {
      background: var(--accent);
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-value { text-align: right; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

    th, td {
      padding: 0.6rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    td.num, th.num { text-align: right; }

    .note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .bar-row { grid-template-columns: 90px 1fr 70px; }
      .kpi .value { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>E-commerce Sales Dashboard</h1>
    <p>Sales, profit, and margin by category and region</p>
  </header>

  <main>
    <div class="filters">
      <label>Category
        <select id="categoryFilter"></select>
      </label>
      <label>Region
        <select id="regionFilter"></select>
      </label>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">Total Sales</div><div class="value" id="kpiSales">-</div></div>
      <div class="kpi"><div class="label">Total Profit</div><div class="value" id="kpiProfit">-</div></div>
      <div class="kpi"><div class="label">Profit Margin</div><div class="value" id="kpiMargin">-</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value" id="kpiOrders">-</div></div>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>Sales by Category</h2>
        <div id="categoryBars"></div>
      </div>

        <h2>Profit by Region</h2>

          </thead>
          <tbody id="regionTable"></tbody>
        </table>
      </div>
    </div>

    <p class="note">Data: 1,000 e-commerce orders placed in 2025.</p>
  </main>

    const money = (n) => "₹" + n.toLocaleString("en-IN");
    const crore = (n) => "₹" + (n / 10000000).toFixed(2) + " Cr";
    const lakh = (n) => "₹" + (n / 100000).toFixed(1) + " L";

    // Fill the filter dropdowns.
    function fillSelect(id, options) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="All">All</option>' +
        options.map(o => `<option value="${o}">${o}</option>`).join("");
    }
    fillSelect("categoryFilter", categories);
    fillSelect("regionFilter", regions);

    // Summarize orders by a key, e.g. "category" or "region".
    function summarize(rows, key) {
      const groups = {};
      rows.forEach(r => {
        if (!groups[r[key]]) groups[r[key]] = { sales: 0, profit: 0 };
        groups[r[key]].sales += r.sales;
        groups[r[key]].profit += r.profit;
      });
      return groups;
    }

    function render() {
      const cat = document.getElementById("categoryFilter").value;
      const reg = document.getElementById("regionFilter").value;

      const rows = orders.filter(o =>
        (cat === "All" || o.category === cat) &&
        (reg === "All" || o.region === reg)
      );

      // KPI cards
      const totalSales = rows.reduce((sum, r) => sum + r.sales, 0);
      const totalProfit = rows.reduce((sum, r) => sum + r.profit, 0);
      const margin = totalSales ? (totalProfit / totalSales) * 100 : 0;

      document.getElementById("kpiSales").textContent = rows.length ? crore(totalSales) : "-";
      document.getElementById("kpiProfit").textContent = rows.length ? lakh(totalProfit) : "-";
      document.getElementById("kpiMargin").textContent = rows.length ? margin.toFixed(1) + "%" : "-";
      document.getElementById("kpiOrders").textContent = rows.length.toLocaleString("en-IN");

      // Category bars
      const byCategory = summarize(rows, "category");
      const maxSales = Math.max(1, ...Object.values(byCategory).map(g => g.sales));
      const barsHtml = categories
        .filter(c => byCategory[c])
        .map(c => {
          const pct = (byCategory[c].sales / maxSales) * 100;
          return `
            <div class="bar-row">
              <span>${c}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              <span class="bar-value">${lakh(byCategory[c].sales)}</span>
            </div>`;
        }).join("");
      document.getElementById("categoryBars").innerHTML =
        barsHtml || '<div class="empty">No orders match these filters.</div>';

      // Region table
      const byRegion = summarize(rows, "region");
      const tableHtml = regions
        .filter(r => byRegion[r])
        .map(r => {
          const g = byRegion[r];
          const m = g.sales ? ((g.profit / g.sales) * 100).toFixed(1) : "0.0";
          return `<tr>
            <td>${r}</td>
            <td class="num">${lakh(g.sales)}</td>
            <td class="num">${lakh(g.profit)}</td>
            <td class="num">${m}%</td>
          </tr>`;
        }).join("");
      document.getElementById("regionTable").innerHTML =
        tableHtml || '<tr><td colspan="4" class="empty">No data</td></tr>';
    }

    document.getElementById("categoryFilter").addEventListener("change", render);
    document.getElementById("regionFilter").addEventListener("change", render);
    render();
  </script>
